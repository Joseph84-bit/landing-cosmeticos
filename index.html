<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeautyGlow | Catálogo Editable</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#333}
    header{background:#f8b6c8;padding:40px 20px;text-align:center}
    h1{margin:0}
    section{max-width:1200px;margin:auto;padding:40px 20px}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px}
    .card{border:1px solid #eee;border-radius:12px;padding:20px;text-align:center}
    .card img{max-width:100%;border-radius:10px}
    .price{color:#e91e63;font-weight:bold;font-size:1.2rem;margin:10px 0}
    .btn{display:inline-block;margin-top:10px;padding:10px 20px;background:#25d366;color:#fff;text-decoration:none;border-radius:25px;font-weight:bold}
    footer{text-align:center;padding:20px;background:#f5f5f5}
  </style>
</head>
<body>

<header>
  <img src="imagenes/logo.jpg" alt="BeautyGlow Logo" style="max-width:140px;margin-bottom:15px;">
  <h1>Miraléa Cosmeticos</h1>
  <p>Catálogo de Cosméticos – Editable</p>
</header>

<section>
  <div class="products" id="catalogo"></div>
</section>

<footer>
  © 2026 BeautyGlow | Ventas por WhatsApp
</footer>

<script>
/* =============================
   ✏️ CATÁLOGO EDITABLE
   Solo edita esta sección
   ============================= */

const telefonoWhatsApp = "5215512345678"; // ← TU NÚMERO

const productos = [
  // 🔴 Si agotado = true → se muestra "AGOTADO" y se desactiva WhatsApp
  {
    nombre: "Labial Matte",
    descripcion: "Color intenso y larga duración",
    precio: "$199 MXN",
    imagen: "imagenes/labial.jpg",
    agotado: false
  },
  {
    nombre: "Base Líquida",
    descripcion: "Cobertura natural todo el día",
    precio: "$349 MXN",
    imagen: "imagenes/base.jpg",
    agotado: true
  },
  {
    nombre: "Paleta de Sombras",
    descripcion: "Colores vibrantes",
    precio: "$499 MXN",
    imagen: "imagenes/sombras.jpg",
    agotado: false
  }
];

/* ============================= */

const contenedor = document.getElementById("catalogo");

productos.forEach(p => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img src="${p.imagen}" alt="${p.nombre}">
    ${p.agotado ? '<div style="color:#fff;background:#999;padding:6px;border-radius:8px;font-weight:bold;margin:10px 0;">AGOTADO</div>' : ''}
    <h3>${p.nombre}</h3>
    <p>${p.descripcion}</p>
    <div class="price">${p.precio}</div>
    ${p.agotado ? '' : `<a class="btn" href="https://wa.me/${telefonoWhatsApp}?text=Hola%20me%20interesa%20el%20${encodeURIComponent(p.nombre)}" target="_blank">Comprar por WhatsApp</a>`}
  `;
  contenedor.appendChild(card);
});
</script>

</body>
</html>
